name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      # Linting only needs the dev group (ruff); skip the heavy runtime deps.
      - name: Install lint dependencies
        run: uv sync --frozen --only-dev

      - name: Run all linters
        run: just lint-all
        env:
          UV_NO_SYNC: "1"
