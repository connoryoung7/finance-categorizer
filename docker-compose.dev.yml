services:
  api:
    build:
      context: .
      target: dev
    command: uvicorn src.entrypoints.api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src:cached

  worker:
    build:
      context: .
      target: dev
    volumes:
      - ./src:/app/src:cached

  flower:
    build:
      context: .
      target: dev
    volumes:
      - ./src:/app/src:cached
