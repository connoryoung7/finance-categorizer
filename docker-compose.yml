x-app-env: &app-env
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/finance_categorizer

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_categorizer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      target: prod
    command: uvicorn src.entrypoints.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: .
      target: prod
    command: celery -A src.entrypoints.celery_worker worker --loglevel=info
    env_file: .env
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  beat:
    build:
      context: .
      target: prod
    command: celery -A src.entrypoints.celery_worker beat --loglevel=info
    env_file: .env
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  flower:
    build:
      context: .
      target: prod
    command: celery -A src.entrypoints.celery_worker flower --port=5555
    ports: ["5555:5555"]
    env_file: .env
    environment: *app-env
    depends_on:
      - redis
      - worker
    restart: unless-stopped

volumes:
  pgdata:
