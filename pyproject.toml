[project]
name = "finance-categorizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.9.3",
    "docling>=2.64.1",
    "fastapi[standard]>=0.123.8",
    "html-to-markdown>=2.23.4",
    "httpx>=0.28.1",
    "mistralai>=1.9.11",
    "nylas>=6.14.2",
    "pip>=25.3",
    "polars>=1.35.2",
    "presidio-analyzer[transformers]>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "schedule>=1.2.2",
    "spacy>=3.8.11",
    "sqlalchemy>=2.0.45",
    "toon-format>=0.1.0",
    "ynab>=1.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "I",     # isort (import sorting)
    "W292",  # no newline at end of file
]

[tool.ruff.lint.isort]
# Section order: standard library, third-party, first-party (local)
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
# Alphabetically sort imports within each section
force-sort-within-sections = true
# Detect the project name for first-party imports
known-first-party = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
